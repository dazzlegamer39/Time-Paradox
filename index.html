<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Paradox</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#00ffcc">
</head>
<body>
    <header>
        <h1>TIME PARADOX</h1>
        <p>AI Causality Engine v2.0</p>
    </header>

    <main id="game-container">
        <section id="mission-briefing">
            <h2>Sandbox Mode: Infinite Anomalies</h2>
            <p><strong>Goal:</strong> Alter history. The universe is yours to break.</p>
        </section>

    <!-- Add this button above your intervention panel -->
    <button id="open-codex-btn" class="secondary-btn">📖 View Timeline Codex</button>


    <!-- Add this entirely new section at the bottom -->
        
        
<section id="intervention-panel">
    <h2>Select Case File</h2>
    <select id="case-file-selector" class="input-field">
        <option value="custom">Chaos Sandbox (Custom Era)</option>
        <option value="case-01">Case #01: The Archduke's Wrong Turn (1914)</option>
        <option value="case-02">Case #02: The Apple and the Gravity (1666)</option>
    </select>

    <h2>Chronos Intervention</h2>
    <input type="text" id="input-era" placeholder="WHEN: e.g., 44 BC Rome" class="input-field">
    <input type="text" id="input-location" placeholder="WHERE/WHO: e.g., The Senate Floor" class="input-field">
    <input type="text" id="input-action" placeholder="WHAT: e.g., Swap the daggers for rubber props" class="input-field">
    
    <button id="simulate-btn">Simulate Timeline</button>
</section>

        <section id="result-panel" class="hidden">
            <h3>Simulation Result</h3>
            <div id="timeline-outcome"></div>
            <button id="reset-btn">Reset Timeline</button>
        </section>

        <section id="codex-panel" class="hidden">
        <h2>Timeline Codex</h2>
        <p>A record of all your historical alterations.</p>
        <div id="codex-list">
            <!-- Saved timelines will appear here -->
        </div>
        <button id="close-codex-btn">Back to Simulator</button>
        <button id="clear-codex-btn" style="background-color: #777; margin-top: 10px;">Clear History</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
