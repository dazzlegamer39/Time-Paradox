<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Paradox</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#00ffcc">
</head>
<body>
    <header>
        <h1>TIME PARADOX</h1>
        <p>AI Causality Engine v2.0</p>
    </header>

    <main id="game-container">
        <section id="mission-briefing">
            <h2>Sandbox Mode: Infinite Anomalies</h2>
            <p><strong>Goal:</strong> Alter history. The universe is yours to break.</p>
        </section>

        <section id="intervention-panel">
            <h3>Configure Intervention</h3>
            
            <label for="input-era">WHEN (Era or Year):</label>
            <input type="text" id="input-era" placeholder="e.g., 65 Million BC, 1999, The Renaissance" />

            <label for="input-location">WHERE (Location or Person):</label>
            <input type="text" id="input-location" placeholder="e.g., Chicxulub Crater, Steve Jobs' Garage" />

            <label for="input-action">WHAT (Your Action):</label>
            <input type="text" id="input-action" placeholder="e.g., Deflect the asteroid, Hand out smartphones" />

            <button id="simulate-btn">Inject Tweak & Simulate</button>
            <p id="loading-text" class="hidden">Calculating temporal ripples...</p>
        </section>

        <section id="result-panel" class="hidden">
            <h3>Simulation Result</h3>
            <div id="timeline-outcome"></div>
            <button id="reset-btn">Reset Timeline</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
